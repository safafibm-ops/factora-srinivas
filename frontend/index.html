<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factora — Autonomous Cyber Defense Platform</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            tactile: {
              canvas: '#E9ECF2',
              darkcanvas: '#0C0E12',
              card: '#FCFCFE',
              darkcard: '#16181E',
              obsidian: '#18191E',
              darksurface: '#1E2028',
              border: 'rgba(0,0,0,0.06)',
              darkborder: 'rgba(255,255,255,0.08)',
              ember: '#FF5722',
              emberlight: '#FF7A45',
              emerald: '#00E599',
              amber: '#FF9500',
              danger: '#FF3B30'
            }
          },
          boxShadow: {
            'tactile-card': '0 16px 36px -6px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03), inset 0 1px 1px 0 rgba(255, 255, 255, 0.95)',
            'tactile-darkcard': '0 16px 36px -6px rgba(0, 0, 0, 0.4), 0 4px 12px -2px rgba(0, 0, 0, 0.3), inset 0 1px 1px 0 rgba(255, 255, 255, 0.1)',
            'keycap': '0 8px 20px -3px rgba(0, 0, 0, 0.32), 0 2px 6px -1px rgba(0, 0, 0, 0.18), inset 0 1px 1px 0 rgba(255, 255, 255, 0.22)',
            'keycap-inset': 'inset 0 3px 6px 0 rgba(0, 0, 0, 0.4)',
            'trough': 'inset 0 3px 8px 0 rgba(0, 0, 0, 0.12), 0 1px 1px 0 rgba(255, 255, 255, 0.8)'
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #E9ECF2;
      color: #18191E;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .dark body {
      background-color: #0C0E12;
      color: #F0F2F6;
    }
    .gauge-needle {
      transform-origin: 50% 100%;
      transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(2px 6px 6px rgba(0,0,0,0.35));
    }
    .needle-groove {
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.14);
    }
    /* 3D stacked deck offsets */
    .deck-layer-1 { transform: translateY(0) scale(1); z-index: 30; }
    .deck-layer-2 { transform: translateY(8px) scale(0.96); z-index: 20; opacity: 0.9; }
    .deck-layer-3 { transform: translateY(16px) scale(0.92); z-index: 10; opacity: 0.75; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1')
      ? 'http://localhost:8000/api'
      : '/api';

    // SVG Icons
    const Icons = {
      Shield: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>,
      TopoGraph: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>,
      Community: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      External: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>,
      Bot: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>,
      ArrowUpRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 17L17 7M17 7H7M17 7V17"/></svg>,
      Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>,
      Alert: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    };

    // =========================================================================
    // 1. Carved Tactile Speedometer Gauge (Image 3 & Approved Mockup)
    // =========================================================================
    function CarvedTactileGauge({ score, tier }) {
      const angle = -90 + (score / 100) * 180;

      const getTierData = () => {
        if (score >= 85) return { color: '#EF4444', label: 'CRITICAL SCAM', bg: 'rgba(239, 68, 68, 0.15)' };
        if (score >= 70) return { color: '#FF5722', label: 'HIGH RISK', bg: 'rgba(255, 87, 34, 0.15)' };
        if (score >= 45) return { color: '#F59E0B', label: 'CAUTION', bg: 'rgba(245, 158, 11, 0.15)' };
        if (score >= 20) return { color: '#3B82F6', label: 'LOW RISK', bg: 'rgba(59, 130, 246, 0.15)' };
        return { color: '#00E599', label: 'VERIFIED SAFE', bg: 'rgba(0, 229, 153, 0.15)' };
      };

      const tierData = getTierData();

      return (
        <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-6 shadow-tactile-card dark:shadow-tactile-darkcard border border-white/60 dark:border-white/5 relative overflow-hidden flex flex-col justify-between">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[11px] font-extrabold tracking-wider text-gray-400 uppercase">P.R.I.M.E. Risk Meter</span>
            <span className="text-[10px] font-mono font-bold px-2.5 py-1 rounded-full bg-black/5 dark:bg-white/10 text-gray-700 dark:text-gray-300">
              0 – 100 SCALE
            </span>
          </div>

          {/* Carved Gauge Dial */}
          <div className="relative w-full h-40 flex items-end justify-center overflow-hidden pt-2">
            <svg viewBox="0 0 200 120" className="w-64 h-36">
              <defs>
                <linearGradient id="carvedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#00E599" />
                  <stop offset="35%" stopColor="#3B82F6" />
                  <stop offset="65%" stopColor="#FF9500" />
                  <stop offset="100%" stopColor="#FF3B30" />
                </linearGradient>
                {/* Trough Inner Shadow filter */}
                <filter id="insetShadow">
                  <feOffset dx="0" dy="3" />
                  <feGaussianBlur stdDeviation="3" result="offset-blur" />
                  <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
                  <feFlood floodColor="black" floodOpacity="0.25" result="color" />
                  <feComposite operator="in" in="color" in2="inverse" result="shadow" />
                  <feComposite operator="over" in="shadow" in2="SourceGraphic" />
                </filter>
              </defs>

              {/* Recessed Groove Track */}
              <path
                d="M 22 105 A 78 78 0 0 1 178 105"
                fill="none"
                stroke="#D8DCE4"
                strokeWidth="16"
                strokeLinecap="round"
                className="dark:stroke-gray-800"
                filter="url(#insetShadow)"
              />

              {/* Active High-Contrast Arc */}
              <path
                d="M 22 105 A 78 78 0 0 1 178 105"
                fill="none"
                stroke="url(#carvedGradient)"
                strokeWidth="16"
                strokeDasharray="245"
                strokeDashoffset={245 - (245 * score) / 100}
                strokeLinecap="round"
              />

              {/* Center Metallic Base */}
              <circle cx="100" cy="105" r="14" fill="#E2E6EE" className="dark:fill-gray-700" />
              <circle cx="100" cy="105" r="9" fill="#18191E" className="dark:fill-white" />

              {/* Extruded 3D Matte Needle */}
              <line
                x1="100"
                y1="105"
                x2="100"
                y2="30"
                stroke="#18191E"
                strokeWidth="4.5"
                strokeLinecap="round"
                className="gauge-needle dark:stroke-white"
                style={{ transform: `rotate(${angle}deg)` }}
              />
            </svg>
          </div>

          {/* Calibrated Numerical Readout */}
          <div className="text-center mt-2">
            <div className="text-5xl font-black tracking-tight text-gray-900 dark:text-white font-mono">
              {score}
              <span className="text-xs font-semibold text-gray-400 font-sans ml-1.5">INDEX</span>
            </div>
            
            <div
              className="inline-flex items-center gap-1.5 px-3.5 py-1.5 mt-2.5 rounded-full text-xs font-black uppercase tracking-wider"
              style={{ backgroundColor: tierData.bg, color: tierData.color }}
            >
              <span className="w-2 h-2 rounded-full animate-ping" style={{ backgroundColor: tierData.color }}></span>
              {tier || tierData.label}
            </div>
          </div>

          {/* Reference Image 3 Calibrations (0, 18, 32... 100) */}
          <div className="flex justify-between w-full text-xs text-gray-400 font-mono mt-4 pt-3 border-t border-black/[0.06] dark:border-white/5">
            <span>0 SAFE</span>
            <span className="font-bold text-gray-700 dark:text-gray-300">50 CAUTION</span>
            <span>100 THREAT</span>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. 3D Stacked Card Deck (Image 3 "Shiela Young" & Approved Mockup)
    // =========================================================================
    function StackedCardDeck({ claimedOrg, domainMismatch, officialDomain }) {
      return (
        <div className="relative h-44 flex items-center justify-center p-2">
          {/* Layer 3 (Deepest) */}
          <div className="absolute inset-x-4 top-4 h-32 rounded-3xl bg-[#141519] deck-layer-3 shadow-lg border border-white/5"></div>
          
          {/* Layer 2 (Middle) */}
          <div className="absolute inset-x-2 top-2 h-32 rounded-3xl bg-[#20222A] deck-layer-2 shadow-xl border border-white/10"></div>

          {/* Layer 1 (Top Hero Surface) */}
          <div className="relative w-full h-32 rounded-3xl bg-white dark:bg-[#282B35] deck-layer-1 p-4 shadow-keycap flex items-center justify-between border border-white/60 dark:border-white/15">
            <div className="flex items-center gap-3">
              <div className="relative">
                <div className="w-12 h-12 rounded-2xl bg-tactile-obsidian text-white flex items-center justify-center font-black text-lg shadow-keycap">
                  {claimedOrg ? claimedOrg[0] : 'T'}
                </div>
                <span className="absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-white dark:border-black"></span>
              </div>
              <div>
                <h4 className="text-sm font-extrabold text-gray-900 dark:text-white leading-tight">
                  {claimedOrg || 'Tata Consultancy Services'}
                </h4>
                <span className="text-[11px] font-mono font-bold text-gray-500 dark:text-gray-400">
                  {domainMismatch ? '⚠️ Domain Spoof Detected' : '✓ Verified Brand Entity'}
                </span>
                <div className="mt-1 text-[10px] text-gray-400 font-mono">
                  Official: {officialDomain || 'tcs.com'}
                </div>
              </div>
            </div>

            <div className="flex flex-col items-center gap-1 text-gray-400">
              <button className="p-1 hover:text-black dark:hover:text-white">▲</button>
              <button className="p-1 hover:text-black dark:hover:text-white">▼</button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. 3D Topographic Ember Threat Terrain Graph (Image 5 & Approved Mockup)
    // =========================================================================
    function TopographicEmberGraph({ graphData }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        let anim;
        let t = 0;

        const nodes = graphData?.nodes || [
          { id: 'inc:target', label: 'Offer Letter (TCS Lookalike)', node_type: 'incident', x: 270, y: 130 },
          { id: 'dom:tcs-fake', label: 'tcs-careers-portal.in', node_type: 'domain', x: 130, y: 220 },
          { id: 'upi:scam', label: 'tcs.hrverification@oksbi', node_type: 'phone_upi', x: 440, y: 210 },
          { id: 'camp:syndicate', label: 'GhostRecruiter Syndicate #4', node_type: 'campaign', x: 310, y: 290 },
          { id: 'repo:backdoor', label: 'GitHub: react-candidate-test', node_type: 'github_repo', x: 160, y: 70 }
        ];

        const edges = graphData?.edges || [
          { source: 'inc:target', target: 'dom:tcs-fake', rel: 'unauthorized_domain' },
          { source: 'inc:target', target: 'upi:scam', rel: 'demands_₹3500_deposit' },
          { source: 'dom:tcs-fake', target: 'camp:syndicate', rel: 'attributed_campaign' },
          { source: 'inc:target', target: 'repo:backdoor', rel: 'malware_assessment' }
        ];

        function draw() {
          t += 0.016;
          ctx.clearRect(0, 0, width, height);

          // 1. Draw 3D Volcanic Ember Ridges (Image 5 style)
          const ridgeLayers = [
            { base: height - 30, amp: 26, freq: 0.007, fill: '#141519', stroke: '#2A2C34', alpha: 0.95 },
            { base: height - 65, amp: 36, freq: 0.011, fill: '#E64A19', stroke: '#FF5722', alpha: 0.28 },
            { base: height - 105, amp: 46, freq: 0.015, fill: '#FF5722', stroke: '#FF7A45', alpha: 0.35 },
            { base: height - 150, amp: 56, freq: 0.018, fill: '#FF8A65', stroke: '#FFAB91', alpha: 0.18 }
          ];

          ridgeLayers.forEach((r, idx) => {
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 10) {
              const y = r.base - Math.sin(x * r.freq + t + idx * 0.8) * r.amp;
              ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = r.fill;
            ctx.globalAlpha = r.alpha;
            ctx.fill();

            // Luminous Crest Line
            ctx.beginPath();
            for (let x = 0; x <= width; x += 10) {
              const y = r.base - Math.sin(x * r.freq + t + idx * 0.8) * r.amp;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = r.stroke;
            ctx.lineWidth = 1.8;
            ctx.globalAlpha = Math.min(1.0, r.alpha * 2.2);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          });

          // 2. Connect Bezier Splines
          const nodeMap = {};
          nodes.forEach((n, i) => {
            const dynamicY = (n.y || (90 + i * 45)) + Math.sin(t + i) * 3;
            nodeMap[n.id] = { x: n.x || (100 + i * 110), y: dynamicY, data: n };
          });

          edges.forEach(e => {
            const from = nodeMap[e.source];
            const to = nodeMap[e.target];
            if (from && to) {
              ctx.beginPath();
              ctx.moveTo(from.x, from.y);
              const cpX = (from.x + to.x) / 2;
              const cpY = (from.y + to.y) / 2 - 28;
              ctx.quadraticCurveTo(cpX, cpY, to.x, to.y);
              ctx.strokeStyle = 'rgba(255, 87, 34, 0.45)';
              ctx.lineWidth = 1.8;
              ctx.setLineDash([4, 4]);
              ctx.stroke();
              ctx.setLineDash([]);

              // Relationship Label
              ctx.font = '10px JetBrains Mono';
              ctx.fillStyle = '#6B7280';
              ctx.fillText(e.rel, cpX - 25, cpY);
            }
          });

          // 3. Draw Floating Physical Nodes
          nodes.forEach(n => {
            const pos = nodeMap[n.id];
            if (!pos) return;

            // Halo Glow
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2);
            ctx.fillStyle = n.node_type === 'campaign' ? 'rgba(239,68,68,0.25)' : 'rgba(255,87,34,0.2)';
            ctx.fill();

            // Core Disk
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 14, 0, Math.PI * 2);
            ctx.fillStyle = n.node_type === 'incident' ? '#18191E'
              : (n.node_type === 'campaign' ? '#EF4444'
              : (n.node_type === 'phone_upi' ? '#FF9500' : '#3B82F6'));
            ctx.fill();

            // Specular Rim
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Text Label
            ctx.font = '11px Plus Jakarta Sans';
            ctx.fillStyle = '#111827';
            ctx.textAlign = 'center';
            ctx.fillText(n.label, pos.x, pos.y + 28);
          });

          anim = requestAnimationFrame(draw);
        }

        draw();
        return () => cancelAnimationFrame(anim);
      }, [graphData]);

      return (
        <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-6 shadow-tactile-card dark:shadow-tactile-darkcard border border-white/60 dark:border-white/5 relative">
          <div className="flex flex-wrap items-center justify-between mb-4 gap-2">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-2 rounded-2xl bg-tactile-obsidian text-white shadow-keycap">
                  <Icons.TopoGraph />
                </span>
                <h3 className="text-base font-extrabold text-gray-900 dark:text-white">
                  3D Topographic Threat Terrain
                </h3>
              </div>
              <p className="text-xs text-gray-500 mt-1">
                Forensic infrastructure map showing connected fake domains, mule accounts, and active syndicates.
              </p>
            </div>

            {graphData?.detected_campaign_name && (
              <span className="px-4 py-1.5 rounded-full text-xs font-bold bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 border border-red-200 dark:border-red-900 flex items-center gap-2 font-mono">
                <span className="w-2.5 h-2.5 rounded-full bg-red-600 animate-ping"></span>
                ACTIVE CAMPAIGN: {graphData.detected_campaign_name}
              </span>
            )}
          </div>

          <div className="rounded-2xl overflow-hidden border border-black/5 dark:border-white/5 bg-[#0D0F14] flex justify-center shadow-inner">
            <canvas ref={canvasRef} width="720" height="370" className="w-full max-w-[720px] h-auto"></canvas>
          </div>

          {/* Historical Attribution Strip */}
          {graphData?.related_incidents && graphData.related_incidents.length > 0 && (
            <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
              {graphData.related_incidents.map((rel, idx) => (
                <div key={idx} className="p-4 bg-tactile-canvas dark:bg-tactile-darksurface rounded-2xl border border-black/[0.04] dark:border-white/5 text-xs">
                  <div className="flex justify-between items-center mb-1">
                    <span className="font-mono font-bold text-gray-900 dark:text-white">{rel.matched_incident_id}</span>
                    <span className="font-mono font-bold text-emerald-600 dark:text-emerald-400">
                      {(rel.relationship_confidence * 100).toFixed(0)}% MATCH
                    </span>
                  </div>
                  <p className="text-gray-600 dark:text-gray-300 leading-relaxed">{rel.connection_explanation}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 4. Interactive "Before You Proceed" Verification Checklist
    // =========================================================================
    function VerificationChecklist({ checklist, incidentId }) {
      const [checked, setChecked] = useState({});

      const toggle = (idx) => setChecked(p => ({ ...p, [idx]: !p[idx] }));
      const doneCount = Object.values(checked).filter(Boolean).length;
      const total = checklist.length;

      return (
        <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-6 shadow-tactile-card dark:shadow-tactile-darkcard border border-white/60 dark:border-white/5">
          <div className="flex items-center justify-between mb-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-2 rounded-2xl bg-emerald-600 text-white shadow-keycap">
                  <Icons.Shield />
                </span>
                <h3 className="text-base font-extrabold text-gray-900 dark:text-white">
                  Before You Proceed: Verification Checklist
                </h3>
              </div>
              <p className="text-xs text-gray-500 mt-1">
                Mandatory defense steps to verify prior to sending money, replying, or downloading code.
              </p>
            </div>

            <div className="text-right">
              <span className="text-xs font-mono font-bold text-gray-900 dark:text-white">
                {doneCount} / {total} Verified
              </span>
              <div className="w-28 h-2 bg-gray-200 dark:bg-gray-800 rounded-full mt-1.5 overflow-hidden">
                <div
                  className="h-full bg-emerald-500 rounded-full transition-all duration-300"
                  style={{ width: `${total ? (doneCount / total) * 100 : 0}%` }}
                ></div>
              </div>
            </div>
          </div>

          <div className="space-y-3">
            {checklist.map((step, idx) => {
              const isDone = checked[idx] || false;
              return (
                <div
                  key={idx}
                  onClick={() => toggle(idx)}
                  className={`p-4 rounded-2xl border transition-all cursor-pointer select-none flex items-start gap-3.5 ${
                    isDone
                      ? 'bg-emerald-50/70 dark:bg-emerald-950/20 border-emerald-300 dark:border-emerald-800'
                      : 'bg-[#F8F9FC] dark:bg-tactile-darksurface border-black/[0.04] dark:border-white/5 hover:border-gray-400'
                  }`}
                >
                  <input

                          <span className="font-bold text-sm">WhatsApp Safety Bot</span>
                          <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        </div>
                        <p className="text-xs text-gray-500 mt-2">Forward offer letters on WhatsApp for instant P.R.I.M.E. verification.</p>
                        <button className="mt-4 px-3.5 py-1.5 rounded-full bg-tactile-obsidian text-white dark:bg-white dark:text-black text-xs font-bold shadow-keycap">
                          Bot Connected
                        </button>
                      </div>

                      <div className="p-5 bg-tactile-canvas dark:bg-tactile-darksurface rounded-2xl border border-black/[0.04] dark:border-white/5">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-sm">FastAPI Gateway</span>
                          <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        </div>
                        <p className="text-xs text-gray-500 mt-2">REST API for college placement cells & TPO ERPs.</p>
                        <code className="mt-3 block text-[11px] font-mono text-gray-600 dark:text-gray-300">
                          POST /api/analyzer/analyze
                        </code>
                      </div>
                    </div>
                  </div>
                )}

              </main>

              {/* Footer */}
              <footer className="border-t border-black/[0.06] dark:border-white/5 py-6 mt-12 bg-tactile-card dark:bg-tactile-darkcard px-8 mb-16 md:mb-0">
                <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between text-xs text-gray-400 gap-2">
                  <span>Factora Cyber Defense Platform • Problem 1: Safety Tech — FAKE OR REAL</span>
                  <span>Trained on 32,500+ Real Benchmark Records • Calibrated ML & P.R.I.M.E. Engine</span>
                </div>
              </footer>

            </div>

            {/* Mobile Bottom Navigation Bar (md:hidden) */}
            <div className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-tactile-card/95 dark:bg-tactile-darkcard/95 backdrop-blur-md border-t border-black/[0.08] dark:border-white/10 px-3 py-2 flex items-center justify-around shadow-keycap">
              {[
                { id: 'scan', icon: Icons.Shield, label: 'Scanner' },
                { id: 'network', icon: Icons.TopoGraph, label: '3D Graph' },
                { id: 'community', icon: Icons.Community, label: 'Hub' },
                { id: 'bots', icon: Icons.Bot, label: 'Bots' }
              ].map(item => {
                const Icon = item.icon;
                const isActive = view === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setView(item.id)}
                    className={`flex flex-col items-center gap-1 px-3 py-1 rounded-xl transition-all ${
                      isActive
                        ? 'text-tactile-ember dark:text-tactile-emberlight font-bold'
                        : 'text-gray-400 hover:text-black dark:hover:text-white'
                    }`}
                  >
                    <Icon />
                    <span className="text-[10px]">{item.label}</span>
                  </button>
                );
              })}
              <button
                onClick={() => setDark(!dark)}
                className="flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-gray-400 hover:text-black dark:hover:text-white"
              >
                <span className="text-base">{dark ? '☀️' : '🌙'}</span>
                <span className="text-[10px]">{dark ? 'Light' : 'Dark'}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
