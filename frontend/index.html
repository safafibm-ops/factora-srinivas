<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factora — Autonomous Cyber Defense Platform</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            tactile: {
              canvas: '#F3F5F8',
              darkcanvas: '#101216',
              card: '#FFFFFF',
              darkcard: '#191C21',
              obsidian: '#18191E',
              darksurface: '#1E2028',
              border: 'rgba(0,0,0,0.06)',
              darkborder: 'rgba(255,255,255,0.08)',
              ember: '#FF5722',
              emberlight: '#FF7A45',
              emerald: '#00E599',
              amber: '#FF9500',
              danger: '#FF3B30'
            }
          },
          boxShadow: {
            'tactile-card': '0 16px 36px -6px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03), inset 0 1px 1px 0 rgba(255, 255, 255, 0.95)',
            'tactile-darkcard': '0 8px 24px -10px rgba(0, 0, 0, 0.5)',
            'keycap': '0 8px 20px -3px rgba(0, 0, 0, 0.32), 0 2px 6px -1px rgba(0, 0, 0, 0.18), inset 0 1px 1px 0 rgba(255, 255, 255, 0.22)',
            'keycap-inset': 'inset 0 3px 6px 0 rgba(0, 0, 0, 0.4)',
            'trough': 'inset 0 3px 8px 0 rgba(0, 0, 0, 0.12), 0 1px 1px 0 rgba(255, 255, 255, 0.8)'
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #F3F5F8;
      color: #18191E;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .dark body {
      background-color: #101216;
      color: #F0F2F6;
    }
    .dark .shadow-tactile-card,
    .dark .shadow-keycap {
      box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.5);
    }
    .gauge-needle {
      transform-origin: 50% 100%;
      transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(2px 6px 6px rgba(0,0,0,0.35));
    }
    .needle-groove {
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.14);
    }
    /* 3D stacked deck offsets */
    .deck-layer-1 { transform: translateY(0) scale(1); z-index: 30; }
    .deck-layer-2 { transform: translateY(8px) scale(0.96); z-index: 20; opacity: 0.9; }
    .deck-layer-3 { transform: translateY(16px) scale(0.92); z-index: 10; opacity: 0.75; }
    @keyframes sandboxBackdropIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sandboxWindowIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes sandboxBackdropOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes sandboxWindowOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(12px) scale(.98); } }
    .sandbox-backdrop { animation: sandboxBackdropIn .22s ease-out both; }
    .sandbox-window { animation: sandboxWindowIn .28s cubic-bezier(.2,.8,.2,1) both; }
    .sandbox-closing { animation: sandboxBackdropOut .18s ease-in both; }
    .sandbox-closing .sandbox-window { animation: sandboxWindowOut .18s ease-in both; }
    @media (prefers-reduced-motion: reduce) { .sandbox-backdrop, .sandbox-window, .sandbox-closing, .sandbox-closing .sandbox-window { animation-duration: .01ms; } }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = window.location.protocol === 'file:'
      ? 'http://127.0.0.1:8000/api'
      : (window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1')
          ? `${window.location.origin}/api`
          : '/api');

    // SVG Icons
    const Icons = {
      Shield: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>,
      TopoGraph: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>,
      Community: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      External: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>,
      Bot: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>,
      ArrowUpRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 17L17 7M17 7H7M17 7V17"/></svg>,
      Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>,
      Alert: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    };

    // =========================================================================
    // 1. Carved Tactile Speedometer Gauge (Image 3 & Approved Mockup)
    // =========================================================================
    function CarvedTactileGauge({ score, tier }) {
      const angle = -90 + (score / 100) * 180;

      const getTierData = () => {
        if (score >= 85) return { color: '#EF4444', label: 'CRITICAL SCAM', bg: 'rgba(239, 68, 68, 0.15)' };
        if (score >= 70) return { color: '#FF5722', label: 'HIGH RISK', bg: 'rgba(255, 87, 34, 0.15)' };
        if (score >= 45) return { color: '#F59E0B', label: 'CAUTION', bg: 'rgba(245, 158, 11, 0.15)' };
        if (score >= 20) return { color: '#3B82F6', label: 'LOW RISK', bg: 'rgba(59, 130, 246, 0.15)' };
        return { color: '#00E599', label: 'VERIFIED SAFE', bg: 'rgba(0, 229, 153, 0.15)' };
      };

      const tierData = getTierData();

      return (
        <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-6 shadow-tactile-card dark:shadow-tactile-darkcard border border-white/60 dark:border-white/5 relative overflow-hidden flex flex-col justify-between">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[11px] font-extrabold tracking-wider text-gray-400 uppercase">P.R.I.M.E. Risk Meter</span>
            <span className="text-[10px] font-mono font-bold px-2.5 py-1 rounded-full bg-black/5 dark:bg-white/10 text-gray-700 dark:text-gray-300">
              0 – 100 SCALE
            </span>
          </div>

          {/* Carved Gauge Dial */}
          <div className="relative w-full h-40 flex items-end justify-center overflow-hidden pt-2">
            <svg viewBox="0 0 200 120" className="w-64 h-36">
              <defs>
                <linearGradient id="carvedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#00E599" />
                  <stop offset="35%" stopColor="#3B82F6" />
                  <stop offset="65%" stopColor="#FF9500" />
                  <stop offset="100%" stopColor="#FF3B30" />
                </linearGradient>
                {/* Trough Inner Shadow filter */}
                <filter id="insetShadow">
                  <feOffset dx="0" dy="3" />
                  <feGaussianBlur stdDeviation="3" result="offset-blur" />
                  <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
                  <feFlood floodColor="black" floodOpacity="0.25" result="color" />
                  <feComposite operator="in" in="color" in2="inverse" result="shadow" />
                  <feComposite operator="over" in="shadow" in2="SourceGraphic" />
                </filter>
              </defs>

              {/* Recessed Groove Track */}
              <path
                d="M 22 105 A 78 78 0 0 1 178 105"
                fill="none"
                stroke="#D8DCE4"
                strokeWidth="16"
                strokeLinecap="round"
                className="dark:stroke-gray-800"
                filter="url(#insetShadow)"
              />

              {/* Active High-Contrast Arc */}
              <path
                d="M 22 105 A 78 78 0 0 1 178 105"
                fill="none"
                stroke="url(#carvedGradient)"
                strokeWidth="16"
                strokeDasharray="245"
                strokeDashoffset={245 - (245 * score) / 100}
                strokeLinecap="round"
              />

              {/* Center Metallic Base */}
              <circle cx="100" cy="105" r="14" fill="#E2E6EE" className="dark:fill-gray-700" />
              <circle cx="100" cy="105" r="9" fill="#18191E" className="dark:fill-white" />

              {/* Extruded 3D Matte Needle */}
              <line
                x1="100"
                y1="105"
                x2="100"
                y2="30"
                stroke="#18191E"
                strokeWidth="4.5"
                strokeLinecap="round"
                className="gauge-needle dark:stroke-white"
                style={{ transform: `rotate(${angle}deg)` }}
              />
            </svg>
          </div>

          {/* Calibrated Numerical Readout */}
          <div className="text-center mt-2">
            <div className="text-5xl font-black tracking-tight text-gray-900 dark:text-white font-mono">
              {score}
              <span className="text-xs font-semibold text-gray-400 font-sans ml-1.5">INDEX</span>
            </div>
            
            <div
              className="inline-flex items-center gap-1.5 px-3.5 py-1.5 mt-2.5 rounded-full text-xs font-black uppercase tracking-wider"
              style={{ backgroundColor: tierData.bg, color: tierData.color }}
            >
              <span className="w-2 h-2 rounded-full animate-ping" style={{ backgroundColor: tierData.color }}></span>
              {tier || tierData.label}
            </div>
          </div>

          {/* Reference Image 3 Calibrations (0, 18, 32... 100) */}
          <div className="flex justify-between w-full text-xs text-gray-400 font-mono mt-4 pt-3 border-t border-black/[0.06] dark:border-white/5">
            <span>0 SAFE</span>
            <span className="font-bold text-gray-700 dark:text-gray-300">50 CAUTION</span>
            <span>100 THREAT</span>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. 3D Stacked Card Deck (Image 3 "Shiela Young" & Approved Mockup)
    // =========================================================================
    function StackedCardDeck({ claimedOrg, domainMismatch, officialDomain }) {
      const [showClaimedIdentity, setShowClaimedIdentity] = useState(true);
      const organization = claimedOrg || 'Organization not specified';
      const domain = officialDomain || 'Domain not provided';
      return (
        <div className="relative h-44 flex items-center justify-center p-2">
          {/* Layer 3 (Deepest) */}
          <div className="absolute inset-x-4 top-4 h-32 rounded-3xl bg-[#141519] deck-layer-3 shadow-lg border border-white/5"></div>
          
          {/* Layer 2 (Middle) */}
          <div className="absolute inset-x-2 top-2 h-32 rounded-3xl bg-[#20222A] deck-layer-2 shadow-xl border border-white/10"></div>

          {/* Layer 1 (Top Hero Surface) */}
          <div className="relative w-full h-32 rounded-3xl bg-white dark:bg-[#282B35] deck-layer-1 p-4 shadow-keycap flex items-center justify-between border border-white/60 dark:border-white/15">
            <div className="flex items-center gap-3">
              <div className="relative">
                <div className="w-12 h-12 rounded-2xl bg-tactile-obsidian text-white flex items-center justify-center font-black text-lg shadow-keycap">
                  {showClaimedIdentity ? organization[0] : '…'}
                </div>
                <span className="absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-white dark:border-black"></span>
              </div>
              <div>
                <h4 className="text-sm font-extrabold text-gray-900 dark:text-white leading-tight">
                  {showClaimedIdentity ? organization : 'Claimed sender hidden'}
                </h4>
                <span className="text-[11px] font-mono font-bold text-gray-500 dark:text-gray-400">
                  {domainMismatch ? '⚠️ Domain Spoof Detected' : 'Claimed identity · not independently verified'}
                </span>
                <div className="mt-1 text-[10px] text-gray-400 font-mono">
                  {showClaimedIdentity ? `Claimed domain: ${domain}` : 'Identity details hidden'}
                </div>
              </div>
            </div>

            <div className="flex flex-col items-center gap-1 text-gray-400">
              <button type="button" aria-label="Show claimed organization details" onClick={() => setShowClaimedIdentity(true)} className="p-1 hover:text-black dark:hover:text-white">▲</button>
              <button type="button" aria-label="Hide claimed organization details" onClick={() => setShowClaimedIdentity(false)} className="p-1 hover:text-black dark:hover:text-white">▼</button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. 3D Topographic Ember Threat Terrain Graph (Image 5 & Approved Mockup)
    // =========================================================================
    function TopographicEmberGraph({ graphData }) {
      const canvasRef = useRef(null);
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const selectedNode = graphData?.nodes?.find(node => node.id === selectedNodeId) || null;
      const selectedDetails = selectedNode ? graphData?.node_details?.[selectedNode.id] : null;

      const selectCanvasNode = (event) => {
        const canvas = canvasRef.current;
        const nodes = graphData?.nodes || [];
        if (!canvas || !nodes.length) return;
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * canvas.width / rect.width;
        const y = (event.clientY - rect.top) * canvas.height / rect.height;
        const radiusX = Math.min(canvas.width * 0.39, 280);
        const radiusY = Math.min(canvas.height * 0.35, 125);
        const nearest = nodes.map((node, index) => {
          const angle = (index / nodes.length) * Math.PI * 2 - Math.PI / 2;
          const nx = canvas.width / 2 + Math.cos(angle) * radiusX;
          const ny = canvas.height / 2 + Math.sin(angle) * radiusY;
          return { node, distance: Math.hypot(nx - x, ny - y) };
        }).sort((a, b) => a.distance - b.distance)[0];
        if (nearest?.distance <= 24) setSelectedNodeId(nearest.node.id);
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        let anim;
        let t = 0;

        const nodes = graphData?.nodes || [];
        const edges = graphData?.edges || [];

        function draw() {
          t += 0.016;
          ctx.clearRect(0, 0, width, height);

          // 1. Draw 3D Volcanic Ember Ridges (Image 5 style)
          const ridgeLayers = [
            { base: height - 30, amp: 26, freq: 0.007, fill: '#141519', stroke: '#2A2C34', alpha: 0.95 },
            { base: height - 65, amp: 36, freq: 0.011, fill: '#E64A19', stroke: '#FF5722', alpha: 0.28 },
            { base: height - 105, amp: 46, freq: 0.015, fill: '#FF5722', stroke: '#FF7A45', alpha: 0.35 },
            { base: height - 150, amp: 56, freq: 0.018, fill: '#FF8A65', stroke: '#FFAB91', alpha: 0.18 }
          ];

          ridgeLayers.forEach((r, idx) => {
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 10) {
              const y = r.base - Math.sin(x * r.freq + t + idx * 0.8) * r.amp;
              ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = r.fill;
            ctx.globalAlpha = r.alpha;
            ctx.fill();

            // Luminous Crest Line
            ctx.beginPath();
            for (let x = 0; x <= width; x += 10) {
              const y = r.base - Math.sin(x * r.freq + t + idx * 0.8) * r.amp;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = r.stroke;
            ctx.lineWidth = 1.8;
            ctx.globalAlpha = Math.min(1.0, r.alpha * 2.2);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          });

          // 2. Connect Bezier Splines
          const nodeMap = {};
          nodes.forEach((n, i) => {
            const angle = (i / Math.max(nodes.length, 1)) * Math.PI * 2 - Math.PI / 2;
            const radiusX = Math.min(width * 0.39, 280);
            const radiusY = Math.min(height * 0.35, 125);
            nodeMap[n.id] = {
              x: width / 2 + Math.cos(angle) * radiusX,
              y: height / 2 + Math.sin(angle) * radiusY + Math.sin(t + i) * 2,
              data: n
            };
          });

          edges.forEach(e => {
            const from = nodeMap[e.source];
            const to = nodeMap[e.target];
            if (from && to) {
              ctx.beginPath();
              ctx.moveTo(from.x, from.y);
              const cpX = (from.x + to.x) / 2;
              const cpY = (from.y + to.y) / 2 - 28;
              ctx.quadraticCurveTo(cpX, cpY, to.x, to.y);
              ctx.strokeStyle = 'rgba(255, 87, 34, 0.45)';
              ctx.lineWidth = 1.8;
              ctx.setLineDash([4, 4]);
              ctx.stroke();
              ctx.setLineDash([]);

              // Relationship Label
              ctx.font = '10px JetBrains Mono';
              ctx.fillStyle = '#6B7280';
              ctx.fillText(e.relationship || e.rel || 'related', cpX - 25, cpY);
            }
          });

          // 3. Draw Floating Physical Nodes
          nodes.forEach(n => {
            const pos = nodeMap[n.id];
            if (!pos) return;

            // Halo Glow
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2);
            ctx.fillStyle = n.node_type === 'incident' ? 'rgba(239,68,68,0.25)' : 'rgba(255,87,34,0.2)';
            ctx.fill();

            // Core Disk
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 14, 0, Math.PI * 2);
            ctx.fillStyle = n.node_type === 'incident' ? '#EF4444'
              : (n.node_type === 'phone_upi' ? '#FF9500'
              : (n.node_type === 'github_repo' ? '#8B5CF6'
              : (n.node_type === 'external_phishing_url' ? '#FF5722' : '#3B82F6')));
            ctx.fill();

            // Specular Rim
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Text Label
            ctx.font = '11px Plus Jakarta Sans';
            ctx.fillStyle = '#E5E7EB';
            ctx.textAlign = 'center';
            ctx.fillText(n.label, pos.x, pos.y + 28);
          });

          anim = requestAnimationFrame(draw);
        }

        draw();
        return () => cancelAnimationFrame(anim);
      }, [graphData]);

      return (
        <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-6 shadow-tactile-card dark:shadow-tactile-darkcard border border-white/60 dark:border-white/5 relative">
          <div className="flex flex-wrap items-center justify-between mb-4 gap-2">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-2 rounded-2xl bg-tactile-obsidian text-white shadow-keycap">
                  <Icons.TopoGraph />
                </span>
                <h3 className="text-base font-extrabold text-gray-900 dark:text-white">
                  3D Topographic Threat Terrain
                </h3>
              </div>
              <p className="text-xs text-gray-500 mt-1">
              Live community reports and the OpenPhish community feed. The sources remain distinct; model similarity is a review lead, not proof.
              </p>
            </div>

            {graphData?.detected_campaign_name && (
              <span className="px-4 py-1.5 rounded-full text-xs font-bold bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 border border-red-200 dark:border-red-900 flex items-center gap-2 font-mono">
                <span className="w-2.5 h-2.5 rounded-full bg-red-600 animate-ping"></span>
                ACTIVE CAMPAIGN: {graphData.detected_campaign_name}
              </span>
            )}
          </div>

          <div className="rounded-2xl overflow-hidden border border-black/5 dark:border-white/5 bg-[#0D0F14] flex justify-center shadow-inner relative">
            <canvas ref={canvasRef} width="720" height="370" onClick={selectCanvasNode} className="w-full max-w-[720px] h-auto cursor-pointer"></canvas>
            {(!graphData || graphData.nodes?.length === 0) && (
              <div className="absolute inset-x-6 top-1/2 -translate-y-1/2 text-center text-xs text-gray-400">
                {graphData?.summary?.message || 'Loading live community reports and Agent 2 correlations…'}
              </div>
            )}
          </div>

          {selectedNode && (
            <div className="mt-3 p-4 bg-tactile-canvas dark:bg-tactile-darksurface rounded-2xl border border-black/[0.06] dark:border-white/5 text-xs">
              <div className="font-bold text-gray-900 dark:text-white">{selectedDetails?.entity_name || selectedNode.label}</div>
              <p className="mt-1 text-gray-600 dark:text-gray-300">{selectedDetails?.details || 'No additional details are available for this graph entity.'}</p>
              <div className="mt-2 flex items-center justify-between gap-3">
                <span className="text-gray-500">Source: {selectedDetails?.source_name || 'Source unavailable'}</span>
                {selectedDetails?.source_url && <a href={selectedDetails.source_url} target="_blank" rel="noopener noreferrer" className="font-bold text-tactile-ember hover:underline">Open source ↗</a>}
              </div>
            </div>
          )}

          <div className="flex flex-wrap items-center justify-between gap-2 text-[11px] text-gray-500 dark:text-gray-400">

    function VerificationChecklist({ checklist, incidentId }) {
      const [checked, setChecked] = useState({});

      const toggle = (idx) => setChecked(p => ({ ...p, [idx]: !p[idx] }));
      const doneCount = Object.values(checked).filter(Boolean).length;
      const total = checklist.length;

      return (
        <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-6 shadow-tactile-card dark:shadow-tactile-darkcard border border-white/60 dark:border-white/5">
          <div className="flex items-center justify-between mb-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-2 rounded-2xl bg-emerald-600 text-white shadow-keycap">
                  <Icons.Shield />
                </span>
                <h3 className="text-base font-extrabold text-gray-900 dark:text-white">
                  Before You Proceed: Verification Checklist
                </h3>
              </div>
              <p className="text-xs text-gray-500 mt-1">
                Mandatory defense steps to verify prior to sending money, replying, or downloading code.
              </p>
            </div>

            <div className="text-right">
              <span className="text-xs font-mono font-bold text-gray-900 dark:text-white">
                {doneCount} / {total} Verified
              </span>
              <div className="w-28 h-2 bg-gray-200 dark:bg-gray-800 rounded-full mt-1.5 overflow-hidden">
                <div
                  className="h-full bg-emerald-500 rounded-full transition-all duration-300"
                  style={{ width: `${total ? (doneCount / total) * 100 : 0}%` }}
                ></div>
              </div>
            </div>
          </div>

          <div className="space-y-3">
            {checklist.map((step, idx) => {
              const isDone = checked[idx] || false;
              return (
                <div
                  key={idx}
                  onClick={() => toggle(idx)}
                  className={`p-4 rounded-2xl border transition-all cursor-pointer select-none flex items-start gap-3.5 ${
                    isDone
                      ? 'bg-emerald-50/70 dark:bg-emerald-950/20 border-emerald-300 dark:border-emerald-800'
                      : 'bg-[#F8F9FC] dark:bg-tactile-darksurface border-black/[0.04] dark:border-white/5 hover:border-gray-400'
                  }`}
                >
                  <input
                    type="checkbox"
                    checked={isDone}
                    onChange={() => {}}
                    className="mt-1 w-5 h-5 rounded-md text-emerald-600 cursor-pointer"
                  />
                  <div className="flex-1">
                    <div className="flex items-center gap-2">
                      <span className={`text-sm font-bold ${isDone ? 'line-through text-gray-400' : 'text-gray-900 dark:text-white'}`}>
                        {step.step_title}
                      </span>
                      {step.is_mandatory && (
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 dark:bg-red-950 text-red-600 dark:text-red-400 font-mono">
                          MANDATORY

                    <p className="text-xs text-gray-600 dark:text-gray-300 mt-1 leading-relaxed">
                      <strong className="text-gray-800 dark:text-gray-100">Why it matters:</strong> {step.why_it_matters}

                    <div className="mt-2.5 text-xs font-mono bg-white dark:bg-[#131418] p-2.5 rounded-xl border border-black/[0.06] dark:border-white/5 text-gray-800 dark:text-gray-200">
                      👉 {step.action_url_or_instruction}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

        fetch(`${API_BASE}/telegram/info`).then(r => r.ok ? r.json() : null).then(d => setTelegramBotUrl(d?.chat_url || null)).catch(() => {});
        Promise.all([
          fetch(`${API_BASE}/analyzer/health`).then(r => r.ok ? r.json() : null),
          fetch(`${API_BASE}/correlator/health`).then(r => r.ok ? r.json() : null)

          analyzer: Boolean(analyzer?.ml_model_loaded),
          correlator: Boolean(correlator?.ml_model_loaded),
          analyzerError: analyzer?.ml_model_error || (!analyzer ? 'Analyzer health endpoint unavailable' : null),
          correlatorError: correlator?.ml_model_error || (!correlator ? 'Correlator health endpoint unavailable' : null),
          checked: true

        return () => window.clearInterval(timer);

            screenshot_base64: mode === 'ocr' ? b64 : null

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const d = await res.json();
          if (!res.ok) throw new Error(d.detail || `Analyzer request failed (${res.status})`);
          setThreat(d);
          setAnalysisIsLive(true);

          const cRes = await fetch(`${API_BASE}/correlator/correlate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ incident_id: d.incident_id, extracted_indicators: d.extracted_indicators })
          });
          const cData = await cRes.json();
          if (!cRes.ok) throw new Error(cData.detail || `Correlation request failed (${cRes.status})`);
          setGraph(cData);
        } catch (e) {
          const hint = window.location.protocol === 'file:'
            ? ' Start the Factora backend from the project folder with: uvicorn backend.main:app --reload --port 8000'

                          onChange={e => setText(e.target.value)}
                          placeholder="Paste an offer letter, email, Telegram message, or college recruitment notice..."
                          className="w-full p-4 rounded-2xl bg-[#F8F9FC] dark:bg-tactile-darkcanvas border border-black/[0.06] dark:border-white/5 text-sm focus:outline-none focus:ring-2 focus:ring-tactile-obsidian dark:focus:ring-white"
                        ></textarea>
                      )}

                      {mode === 'ocr' && (
                        <div className="p-8 border-2 border-dashed border-black/[0.08] dark:border-white/10 rounded-2xl text-center flex flex-col items-center justify-center bg-[#F8F9FC] dark:bg-tactile-darkcanvas">
                          <input type="file" accept="image/*" onChange={(e) => {
                            const file = e.target.files[0];
                            if (!file) return;
                            const r = new FileReader();
                            r.onload = ev => setB64(ev.target.result);
                            r.readAsDataURL(file);
                          }} className="hidden" id="ocr-f" />
                          <label htmlFor="ocr-f" className="cursor-pointer flex flex-col items-center">
                            <span className="text-3xl mb-2">📸</span>
                            <span className="text-sm font-bold text-gray-900 dark:text-white">Upload Offer Letter or Message Screenshot</span>
                            <span className="text-xs text-gray-400 mt-1">Automatic OCR & Vision analysis for stamps, headers, and UPI handles</span>
                          </label>
                          {b64 && (
                            <div className="mt-3 px-3 py-1.5 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-xl font-mono">
                              ✓ Screenshot Decoded Ready for Inspection
                            </div>
                          )}
                        </div>
                      )}

                      {mode === 'url' && (
                        <input
                          type="url"
                          value={url}
                          onChange={e => setUrl(e.target.value)}
                          placeholder="e.g. bit.ly shortener, lookalike careers domain, or fake scholarship link..."
                          className="w-full p-4 rounded-2xl bg-[#F8F9FC] dark:bg-tactile-darkcanvas border border-black/[0.06] dark:border-white/5 text-sm focus:outline-none focus:ring-2 focus:ring-tactile-obsidian dark:focus:ring-white"
                        />
                      )}

                      {mode === 'github' && (
                        <input
                          type="url"
                          value={github}
                          onChange={e => setGithub(e.target.value)}
                          placeholder="e.g. https://github.com/recruiter-tests/react-candidate-2026..."
                          className="w-full p-4 rounded-2xl bg-[#F8F9FC] dark:bg-tactile-darkcanvas border border-black/[0.06] dark:border-white/5 text-sm focus:outline-none focus:ring-2 focus:ring-tactile-obsidian dark:focus:ring-white"
                        />
                      )}

                      <div className="mt-4 flex justify-end">
                        <button
                          onClick={handleAnalyze}
                          disabled={loading}
                          className="px-6 py-3 rounded-xl bg-tactile-obsidian text-white dark:bg-white/10 dark:text-white dark:border dark:border-white/10 font-bold text-xs hover:opacity-90 transition shadow-sm flex items-center gap-2"
                        >
                          {loading ? 'Evaluating Threat Signals...' : 'Run Neuro-Symbolic Threat Scan →'}
                        </button>
                      </div>
                    </div>

                    {/* Threat Analysis Output Section */}
                    {threat && (
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* Column 1: Carved Tactile Speedometer Gauge + Stacked Profile Deck */}
                        <div className="space-y-6">
                          <CarvedTactileGauge
                            score={threat.fuzzy_risk_score}
                            tier={threat.risk_tier}
                          />

                          {/* Stacked Card Deck (Image 3 Style) */}
                          <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-6 shadow-tactile-card border border-white/60 dark:border-white/5">
                            <span className="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-2">Claimed Entity Deck</span>
                            <StackedCardDeck
                              claimedOrg={threat.extracted_indicators?.claimed_organization}
                              domainMismatch={threat.extracted_indicators?.official_domain_mismatch}
                              officialDomain={threat.extracted_indicators?.domains?.[0]}
                            />
                          </div>

                          {/* P.R.I.M.E. 6-Factor Assessment Bars */}
                          <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-6 shadow-tactile-card border border-white/60 dark:border-white/5">
                            <h4 className="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-4">P.R.I.M.E. Criteria Matrix</h4>
                            <div className="space-y-3.5">
                              {[
                                { label: 'P: Proof & Domain Identity', val: threat.prime_criteria_scores?.proof_domain_identity },
                                { label: 'R: Redirection & Obfuscation', val: threat.prime_criteria_scores?.redirection_obfuscation },
                                { label: 'I: Incentive & Urgency', val: threat.prime_criteria_scores?.incentive_urgency },
                                { label: 'M: Money & Transaction Ask', val: threat.prime_criteria_scores?.money_transaction_ask },
                                { label: 'E: Execution & Code Safety', val: threat.prime_criteria_scores?.execution_code_safety },
                                { label: 'S: Student Registry Check', val: threat.prime_criteria_scores?.student_registry_check }
                              ].map((c, i) => (
                                <div key={i}>
                                  <div className="flex justify-between text-xs font-semibold mb-1">
                                    <span className="text-gray-700 dark:text-gray-300">{c.label}</span>
                                    <span className="font-mono font-bold">{c.val || 0} / 10</span>
                                  </div>
                                  <div className="w-full h-2 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden">
                                    <div
                                      className="h-full rounded-full transition-all duration-500"
                                      style={{
                                        width: `${(c.val || 0) * 10}%`,
                                        backgroundColor: (c.val || 0) > 7 ? '#EF4444' : ((c.val || 0) > 4 ? '#FF9500' : '#00E599')
                                      }}
                                    ></div>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>

                        {/* Column 2 & 3: Evidence Bullets + Interactive Verification Checklist */}
                        <div className="lg:col-span-2 space-y-6">
                          
                          {/* Evidence Findings Card */}
                          <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-6 shadow-tactile-card border border-white/60 dark:border-white/5">
                            <div className="flex items-center justify-between mb-3">
                              <h3 className="text-base font-bold text-gray-900 dark:text-white flex items-center gap-2">
                                <Icons.Alert />
                                Forensic Red Flags & Evidence Findings
                              </h3>
                              <span className="text-xs font-mono font-bold text-gray-400">
                                INCIDENT: {threat.incident_id}
                              </span>
                            </div>
                            <div className="space-y-2.5">
                              {threat.why_it_is_risky_summary?.map((ev, idx) => (
                                <div key={idx} className="p-3.5 bg-red-50/70 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded-2xl text-xs text-red-900 dark:text-red-200 flex items-start gap-3">
                                  <span className="text-red-500 font-bold">•</span>
                                  <span className="leading-relaxed font-medium">{ev}</span>
                                </div>
                              ))}
                            </div>

                            {/* Triggered Student Scam Flags */}
                            <div className="mt-4 pt-4 border-t border-black/[0.06] dark:border-white/5 flex flex-wrap gap-2">
                              {threat.extracted_indicators?.student_scam_flags && Object.entries(threat.extracted_indicators.student_scam_flags).map(([k, v]) => (
                                v ? (
                                  <span key={k} className="px-3 py-1 rounded-full text-[11px] font-bold bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 font-mono">
                                    🚩 {k.replace(/_/g, ' ').toUpperCase()}
                                  </span>
                                ) : null
                              ))}
                            </div>

                            {analysisIsLive && (threat.extracted_indicators?.urls || []).length > 0 && (
                              <div className="mt-4 pt-4 border-t border-black/[0.06] dark:border-white/5 space-y-2">
                                <div className="text-[11px] font-bold text-gray-700 dark:text-gray-300">Links found · remote isolated preview</div>
                                {(threat.extracted_indicators.urls).map((targetUrl, index) => (
                                  <div key={`${targetUrl}-${index}`} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 rounded-xl bg-black/[0.025] dark:bg-white/[0.035] px-3 py-2">
                                    <span className="min-w-0 truncate text-[11px] font-mono text-gray-600 dark:text-gray-300" title={targetUrl}>{targetUrl}</span>
                                    <button type="button" onClick={() => openSandboxPreview(targetUrl)} className="shrink-0 px-3 py-2 rounded-xl bg-tactile-obsidian text-white dark:bg-white/10 dark:text-white text-[11px] font-bold hover:opacity-90 transition">Preview safely ↗</button>
                                  </div>
                                ))}
                                <p className="text-[10px] leading-relaxed text-gray-500">The page is rendered in a remote disposable browser and shown here as an image. It is never opened in this device’s browser. A preview is not a safety verdict.</p>
                              </div>
                            )}
                          </div>

                          {/* Mandatory Verification Checklist */}
                          <VerificationChecklist
                            checklist={threat.verify_before_proceeding_checklist || []}
                            incidentId={threat.incident_id}
                          />

                        </div>

                      </div>
                    )}
                  </div>
                )}

                {/* VIEW 2: 3D Topographic Threat Terrain Graph */}
                {view === 'network' && (
                  <TopographicEmberGraph graphData={graph} />
                )}

                {/* VIEW 3: Community Victim Hub */}
                {view === 'community' && (
                  <CommunityVictimHub communityData={comm} externalPortals={portals} />
                )}

                {/* VIEW 4: Bots & Accessibility */}
                {view === 'bots' && (
                  <div className="bg-tactile-card dark:bg-tactile-darkcard rounded-[32px] p-8 shadow-tactile-card border border-white/60 dark:border-white/5 space-y-6">
                    <div className="flex items-center gap-3">
                      <span className="p-3 rounded-2xl bg-tactile-obsidian text-white shadow-keycap">
                        <Icons.Bot />
                      </span>
                      <div>
                        <h3 className="text-lg font-extrabold text-gray-900 dark:text-white">
                          Use Factora in your browser
                        </h3>
                        <p className="text-xs text-gray-500">Scan suspicious messages and sites while you browse.</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                      <div className="p-5 bg-tactile-canvas dark:bg-tactile-darksurface rounded-2xl border border-black/[0.04] dark:border-white/5 md:col-span-2">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-sm">Chrome Web Extension</span>
                          <span className="text-[10px] font-semibold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">Download available</span>
                        </div>
                        <p className="text-xs text-gray-500 mt-2">Analyze the current page, view findings, and re-scan from the browser toolbar. The download is configured to use this Factora server.</p>
                        <a href="/extension/download" className="mt-4 inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-tactile-obsidian text-white dark:bg-white/10 dark:text-white dark:border dark:border-white/10 text-xs font-bold shadow-sm hover:opacity-90 transition">
                          Download extension (.zip) <span aria-hidden="true">→</span>
                        </a>
                        <div className="mt-4 pt-4 border-t border-black/[0.06] dark:border-white/[0.07]">
                          <p className="text-[11px] font-bold text-gray-700 dark:text-gray-300">Install in Chrome</p>
                          <ol className="mt-2 ml-4 list-decimal space-y-1 text-[11px] leading-relaxed text-gray-500 dark:text-gray-400">
                            <li>Download and extract the ZIP.</li>
                            <li>Open <code className="font-mono">chrome://extensions</code> and turn on Developer mode.</li>
                            <li>Choose <strong>Load unpacked</strong> and select the extracted <code className="font-mono">factora-extension</code> folder.</li>
                          </ol>
                        </div>
                      </div>

                      <div className="p-5 bg-tactile-canvas dark:bg-tactile-darksurface rounded-2xl border border-black/[0.04] dark:border-white/5">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-sm">Factora Telegram Bot</span>
                          <span className={`text-[10px] font-semibold uppercase tracking-wider ${telegramBotUrl ? 'text-emerald-700 dark:text-emerald-400' : 'text-gray-500'}`}>{telegramBotUrl ? 'Available' : 'Setup required'}</span>
                        </div>
                        <p className="text-xs text-gray-500 mt-2">Send a suspicious message, screenshot, or text-based PDF and receive a scan summary in Telegram.</p>
                        {telegramBotUrl ? (
                          <a href={telegramBotUrl} target="_blank" rel="noreferrer" className="mt-4 inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-sky-600 text-white text-xs font-bold shadow-sm hover:opacity-90 transition">Open Factora on Telegram <span aria-hidden="true">↗</span></a>
                        ) : (
                          <p className="mt-3 text-[11px] leading-relaxed text-gray-500 dark:text-gray-400">The public chat link appears here after the bot username is configured in the server environment.</p>
                        )}
                      </div>

                      <div className="p-5 bg-tactile-canvas dark:bg-tactile-darksurface rounded-2xl border border-black/[0.04] dark:border-white/5">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-sm">FastAPI Gateway</span>
                          <span className="text-[10px] font-semibold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">Available</span>
                        </div>
                        <p className="text-xs text-gray-500 mt-2">REST API used by the dashboard and browser extension.</p>
                        <code className="mt-3 block text-[11px] font-mono text-gray-600 dark:text-gray-300">
                          POST /api/analyzer/analyze
                        </code>
                      </div>
                    </div>
                  </div>
                )}

              </main>

              {/* Footer */}
              <footer className="border-t border-black/[0.06] dark:border-white/5 py-6 mt-12 bg-tactile-card dark:bg-tactile-darkcard px-8 mb-16 md:mb-0">
                <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between text-xs text-gray-400 gap-2">
                  <span>Factora Cyber Defense Platform • Problem 1: Safety Tech — FAKE OR REAL</span>
                  <span>Analyze messages, links, and repositories with Factora.</span>
                </div>
              </footer>

            </div>

            {sandboxPreview && (
              <div className={`sandbox-backdrop fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/65 backdrop-blur-sm p-3 sm:p-6 ${sandboxClosing ? 'sandbox-closing' : ''}`} onClick={event => { if (event.target === event.currentTarget) closeSandboxPreview(); }} onAnimationEnd={event => { if (event.target === event.currentTarget && sandboxClosing) { setSandboxPreview(null); setSandboxClosing(false); } }}>
                <section role="dialog" aria-modal="true" aria-label="Remote isolated link preview" className="sandbox-window w-full max-w-4xl max-h-[92vh] overflow-hidden rounded-3xl bg-tactile-card dark:bg-tactile-darkcard border border-black/[0.08] dark:border-white/10 shadow-2xl flex flex-col">
                  <header className="flex items-start justify-between gap-4 px-5 py-4 border-b border-black/[0.06] dark:border-white/10">
                    <div className="min-w-0">
                      <h2 className="font-bold text-sm text-gray-900 dark:text-white">Remote isolated preview</h2>
                      <p className="mt-1 truncate font-mono text-[10px] text-gray-500 dark:text-gray-400">{sandboxPreview.result?.final_url || sandboxPreview.url}</p>
                    </div>
                    <button type="button" aria-label="Close preview" onClick={closeSandboxPreview} className="shrink-0 rounded-xl px-3 py-1 text-2xl leading-none text-gray-500 hover:bg-black/5 dark:hover:bg-white/10">×</button>
                  </header>
                  <div className="overflow-auto p-4 sm:p-5">
                    {sandboxPreview.loading && <div className="min-h-64 flex flex-col items-center justify-center gap-3 text-sm text-gray-500"><span className="w-8 h-8 rounded-full border-2 border-tactile-ember border-t-transparent animate-spin"></span>Opening the link in a remote disposable browser…</div>}
                    {sandboxPreview.error && <div role="alert" className="rounded-2xl border border-amber-500/20 bg-amber-50 dark:bg-amber-950/20 p-4 text-sm text-amber-800 dark:text-amber-200">{sandboxPreview.error}</div>}
                    {sandboxPreview.result && <>
                      <div className="mb-3 flex flex-wrap items-center gap-2 text-[10px] font-bold text-emerald-700 dark:text-emerald-300"><span className="w-2 h-2 rounded-full bg-emerald-500"></span> Captured in remote browser{sandboxPreview.result.page_status ? ` · page returned ${sandboxPreview.result.page_status}` : ''}</div>
                      <img src={sandboxPreview.result.image_data_url} alt="Website screenshot captured in a remote disposable browser" className="block max-h-[58vh] w-full rounded-xl border border-black/10 dark:border-white/10 bg-white object-contain" />
                      <p className="mt-3 text-[10px] leading-relaxed text-gray-500 dark:text-gray-400">{sandboxPreview.result.notice}</p>
                    </>}
                  </div>
                  <footer className="flex justify-end px-5 py-3 border-t border-black/[0.06] dark:border-white/10"><button type="button" onClick={closeSandboxPreview} className="px-4 py-2 rounded-xl bg-tactile-obsidian text-white dark:bg-white/10 text-xs font-bold">Close preview</button></footer>
                </section>
              </div>
            )}

            {/* Mobile Bottom Navigation Bar (md:hidden) */}
            <div className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-tactile-card/95 dark:bg-tactile-darkcard/95 backdrop-blur-md border-t border-black/[0.08] dark:border-white/10 px-3 py-2 flex items-center justify-around shadow-keycap">
              {[
                { id: 'scan', icon: Icons.Shield, label: 'Scanner' },
                { id: 'network', icon: Icons.TopoGraph, label: '3D Graph' },
                { id: 'community', icon: Icons.Community, label: 'Hub' },
                { id: 'bots', icon: Icons.Bot, label: 'Bots' }
              ].map(item => {
                const Icon = item.icon;
                const isActive = view === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setView(item.id)}
                    className={`flex flex-col items-center gap-1 px-3 py-1 rounded-xl transition-all ${
                      isActive
                        ? 'text-tactile-ember dark:text-tactile-emberlight font-bold'
                        : 'text-gray-400 hover:text-black dark:hover:text-white'
                    }`}
                  >
                    <Icon />
                    <span className="text-[10px]">{item.label}</span>
                  </button>
                );
              })}
              <button
                onClick={() => setDark(!dark)}
                className="flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-gray-400 hover:text-black dark:hover:text-white"
              >
                <span className="text-base">{dark ? '☀️' : '🌙'}</span>
                <span className="text-[10px]">{dark ? 'Light' : 'Dark'}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
