<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factora — Autonomous Cyber Defense & Safety Tech</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']

              bg: '#F2F4F7',

              card: '#FFFFFF',
              darkcard: '#16181D',
              surface: '#F8F9FB',
              darksurface: '#1E2127',
              charcoal: '#131417',

  <!-- React 18 & Babel Standalone -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body {
      background-color: #F2F4F7;
      color: #131417;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }
    .dark body {
      background-color: #0D0F12;
      color: #F0F2F5;
    }
    /* Gauge Needle Physics */
    .gauge-needle {
      transform-origin: 50% 100%;
      transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    /* Textured hatched bar patterns (from Image 1 Project Analysis) */
    .hatched-bar {
      background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 8px);
    }
    .dark .hatched-bar {
      background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.08) 4px, rgba(255,255,255,0.08) 8px);
    }
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #374151; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1')
      ? 'http://localhost:8000/api'
      : '/api';

    // =========================================================================
    // Icons (Unslop Crafted SVGs)
    // =========================================================================
    const Icons = {
      Shield: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>,
      Graph: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/></svg>,
      Users: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      External: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>,
      Bot: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>,
      Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      ArrowUpRight: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 17L17 7M17 7H7M17 7V17"/></svg>,
      Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>,
      Alert: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    };

    // =========================================================================
    // 1. Tactile Speedometer Gauge Widget (Reference Image 3 Style)
    // =========================================================================
    function TactileGauge({ score, tier }) {
      const angle = -90 + (score / 100) * 180;
      
      const getAccent = () => {
        if (score >= 85) return { color: '#EF4444', text: 'Critical Scam', bg: 'rgba(239, 68, 68, 0.1)' };
        if (score >= 70) return { color: '#FF5722', text: 'High Risk', bg: 'rgba(255, 87, 34, 0.1)' };
        if (score >= 45) return { color: '#F59E0B', text: 'Caution', bg: 'rgba(245, 158, 11, 0.1)' };
        if (score >= 20) return { color: '#3B82F6', text: 'Low Risk', bg: 'rgba(59, 130, 246, 0.1)' };
        return { color: '#10B981', text: 'Verified Safe', bg: 'rgba(16, 185, 129, 0.1)' };
      };

      const accent = getAccent();

      return (
        <div className="bg-white dark:bg-tactile-darkcard rounded-3xl p-6 shadow-tactile border border-tactile-border dark:border-tactile-darkborder relative overflow-hidden">
          <div className="flex items-center justify-between mb-2">
            <span className="text-[11px] font-bold tracking-wider text-gray-400 uppercase">P.R.I.M.E. Risk Meter</span>
            <span className="text-[11px] font-mono font-bold px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300">
              0 – 100 CALIBRATED
            </span>
          </div>

          {/* Semicircular Gauge Track */}
          <div className="relative w-full h-36 flex items-end justify-center overflow-hidden pt-2">
            <svg viewBox="0 0 200 115" className="w-56 h-32">
              <defs>
                <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#10B981" />
                  <stop offset="35%" stopColor="#3B82F6" />
                  <stop offset="65%" stopColor="#F59E0B" />
                  <stop offset="100%" stopColor="#EF4444" />
                </linearGradient>
              </defs>
              {/* Back track */}
              <path
                d="M 24 100 A 76 76 0 0 1 176 100"
                fill="none"
                stroke="#E9ECEF"
                strokeWidth="14"
                strokeLinecap="round"
                className="dark:stroke-gray-800"
              />
              {/* Active colored arc */}
              <path
                d="M 24 100 A 76 76 0 0 1 176 100"
                fill="none"
                stroke="url(#gaugeGradient)"
                strokeWidth="14"
                strokeDasharray="238.7"
                strokeDashoffset={238.7 - (238.7 * score) / 100}
                strokeLinecap="round"
              />
              {/* Center Pin */}
              <circle cx="100" cy="100" r="9" fill="#131417" className="dark:fill-white" />
              {/* Needle Pointer */}
              <line
                x1="100"
                y1="100"
                x2="100"
                y2="32"
                stroke="#131417"
                strokeWidth="3.5"
                strokeLinecap="round"
                className="gauge-needle dark:stroke-white"
                style={{ transform: `rotate(${angle}deg)` }}
              />
            </svg>
          </div>

          {/* Number & Tier Badge */}
          <div className="text-center mt-1">
            <div className="text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white font-mono">
              {score}
              <span className="text-xs font-normal text-gray-400 font-sans ml-1">INDEX</span>
            </div>
            <div
              className="inline-flex items-center gap-1.5 px-3 py-1 mt-2 rounded-full text-xs font-bold uppercase tracking-wider"
              style={{ backgroundColor: accent.bg, color: accent.color }}
            >
              <span className="w-2 h-2 rounded-full animate-pulse" style={{ backgroundColor: accent.color }}></span>
              {tier || accent.text}
            </div>
          </div>

          {/* Calibrated Ticks (Reference Image 3: 0, 18, 32) */}
          <div className="flex justify-between w-full text-[11px] text-gray-400 font-mono mt-4 px-2 border-t border-gray-100 dark:border-gray-800 pt-3">
            <span>0 SAFE</span>
            <span className="font-bold text-gray-700 dark:text-gray-300">50 CAUTION</span>
            <span>100 THREAT</span>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. 3D Topographic / Wave Threat Graph Canvas (Reference Image 5 Style)
    // =========================================================================
    function TopographicThreatGraph({ graphData }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        let animationFrame;
        let t = 0;

        const nodes = graphData?.nodes || [
          { id: 'inc:target', label: 'Offer Letter (TCS Lookalike)', node_type: 'incident', x: 260, y: 140 },
          { id: 'dom:tcs-fake', label: 'tcs-careers-portal.in', node_type: 'domain', x: 120, y: 220 },
          { id: 'upi:scam', label: 'tcs.hrverification@oksbi', node_type: 'phone_upi', x: 420, y: 210 },
          { id: 'camp:syndicate', label: 'GhostRecruiter Syndicate #4', node_type: 'campaign', x: 300, y: 290 },
          { id: 'repo:backdoor', label: 'GitHub: react-interview-test', node_type: 'github_repo', x: 150, y: 80 }
        ];

        const edges = graphData?.edges || [
          { source: 'inc:target', target: 'dom:tcs-fake', relationship: 'unauthorized_domain' },
          { source: 'inc:target', target: 'upi:scam', relationship: 'demands_₹3500_deposit' },
          { source: 'dom:tcs-fake', target: 'camp:syndicate', relationship: 'attributed_campaign' },
          { source: 'inc:target', target: 'repo:backdoor', relationship: 'malware_lure' }
        ];

        function render() {
          t += 0.015;
          ctx.clearRect(0, 0, width, height);

          // 1. Draw 3D Topographic Mountain / Ridge Wave Layers (Image 5 aesthetic)
          const ridges = [
            { base: height - 40, amp: 28, freq: 0.008, color: '#16181D', alpha: 0.08 },
            { base: height - 70, amp: 38, freq: 0.012, color: '#FF5722', alpha: 0.15 },
            { base: height - 110, amp: 45, freq: 0.015, color: '#FF7043', alpha: 0.22 },
            { base: height - 150, amp: 55, freq: 0.018, color: '#131417', alpha: 0.06 }
          ];

          ridges.forEach((r, idx) => {
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 10) {
              const y = r.base - Math.sin(x * r.freq + t + idx) * r.amp;
              ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = r.color;
            ctx.globalAlpha = r.alpha;
            ctx.fill();
            ctx.globalAlpha = 1.0;

            // Highlight ridge line
            ctx.beginPath();
            for (let x = 0; x <= width; x += 10) {
              const y = r.base - Math.sin(x * r.freq + t + idx) * r.amp;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = r.color;
            ctx.globalAlpha = r.alpha * 1.8;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          });

          // 2. Draw Curved Bezier Connection Splines
          const nodeMap = {};
          nodes.forEach((n, i) => {
            const dynamicY = (n.y || (100 + i * 40)) + Math.sin(t + i) * 3;
            nodeMap[n.id] = { x: n.x || (100 + i * 110), y: dynamicY, data: n };
          });

          edges.forEach(e => {
            const from = nodeMap[e.source];
            const to = nodeMap[e.target];
            if (from && to) {
              ctx.beginPath();
              ctx.moveTo(from.x, from.y);
              const cpX = (from.x + to.x) / 2;
              const cpY = (from.y + to.y) / 2 - 25;
              ctx.quadraticCurveTo(cpX, cpY, to.x, to.y);
              ctx.strokeStyle = '#D1D5DB';
              ctx.lineWidth = 1.5;
              ctx.setLineDash([4, 4]);
              ctx.stroke();
              ctx.setLineDash([]);

              ctx.font = '10px JetBrains Mono';
              ctx.fillStyle = '#9CA3AF';
              ctx.fillText(e.relationship, cpX - 25, cpY);
            }
          });

          // 3. Draw Floating Tactile Nodes
          nodes.forEach((n, i) => {
            const pos = nodeMap[n.id];
            if (!pos) return;

            // Soft Ambient Glow
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2);
            ctx.fillStyle = n.node_type === 'campaign' ? 'rgba(239,68,68,0.18)' : 'rgba(255,87,34,0.15)';
            ctx.fill();

            // Node Outer Shell
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 14, 0, Math.PI * 2);
            ctx.fillStyle = n.node_type === 'incident' ? '#131417'
              : (n.node_type === 'campaign' ? '#EF4444'
              : (n.node_type === 'phone_upi' ? '#F59E0B' : '#3B82F6'));
            ctx.fill();

            // Specular border
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Node Label
            ctx.font = '11px Plus Jakarta Sans';
            ctx.fillStyle = '#111827';
            ctx.textAlign = 'center';
            ctx.fillText(n.label, pos.x, pos.y + 26);
          });

          animationFrame = requestAnimationFrame(render);
        }

        render();
        return () => cancelAnimationFrame(animationFrame);
      }, [graphData]);

      return (
        <div className="bg-white dark:bg-tactile-darkcard rounded-3xl p-6 shadow-tactile-heavy border border-tactile-border dark:border-tactile-darkborder relative">
          <div className="flex flex-wrap items-center justify-between mb-4 gap-2">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-xl bg-tactile-charcoal text-white dark:bg-white dark:text-black shadow-tactile-pill">
                  <Icons.Graph />
                </span>
                <h3 className="text-base font-extrabold text-gray-900 dark:text-white">
                  Topographic Threat Intelligence Canvas
                </h3>
              </div>
              <p className="text-xs text-gray-500 mt-1">
                Visualizing correlated multi-incident infrastructure across syndicates, lookalike domains, and mule UPI accounts.
              </p>
            </div>
            
            {graphData?.detected_campaign_name && (
              <span className="px-3.5 py-1.5 rounded-full text-xs font-bold bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 border border-red-200 dark:border-red-900 flex items-center gap-1.5 font-mono">
                <span className="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
                CAMPAIGN: {graphData.detected_campaign_name}
              </span>
            )}
          </div>

          {/* Interactive Canvas */}
          <div className="rounded-2xl overflow-hidden border border-gray-100 dark:border-gray-800 bg-[#FAFAFC] dark:bg-[#0B0C0E] flex justify-center">
            <canvas ref={canvasRef} width="680" height="360" className="w-full max-w-[680px] h-auto"></canvas>
          </div>

          {/* Connected Past Incidents Attribution Deck */}
          {graphData?.related_incidents && graphData.related_incidents.length > 0 && (
            <div className="mt-4 space-y-2">
              <span className="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Syndicate Attack Attribution</span>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {graphData.related_incidents.map((rel, idx) => (
                  <div key={idx} className="p-3.5 bg-gray-50 dark:bg-tactile-darksurface rounded-2xl border border-gray-200 dark:border-gray-800 text-xs">
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-mono font-bold text-gray-900 dark:text-white">{rel.matched_incident_id}</span>
                      <span className="font-mono font-bold text-emerald-600 dark:text-emerald-400">
                        {(rel.relationship_confidence * 100).toFixed(0)}% MATCH
                      </span>
                    </div>
                    <p className="text-gray-600 dark:text-gray-300 leading-relaxed">{rel.connection_explanation}</p>
                    <div className="mt-2 text-[10px] text-gray-500 font-mono">
                      Shared: {rel.shared_indicators.join(' • ')}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 3. Interactive Verification Checklist (Mandatory Feature)
    // =========================================================================
    function VerificationChecklist({ checklist, incidentId }) {
      const [checkedMap, setCheckedMap] = useState({});

      const toggleCheck = (idx) => {
        setCheckedMap(prev => ({ ...prev, [idx]: !prev[idx] }));
      };

      const completed = Object.values(checkedMap).filter(Boolean).length;
      const total = checklist.length;
      const isAllDone = total > 0 && completed === total;

      return (
        <div className="bg-white dark:bg-tactile-darkcard rounded-3xl p-6 shadow-tactile-heavy border border-tactile-border dark:border-tactile-darkborder">
          <div className="flex items-center justify-between mb-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-xl bg-emerald-600 text-white shadow-tactile-pill">
                  <Icons.Shield />
                </span>
                <h3 className="text-base font-extrabold text-gray-900 dark:text-white">
                  Before You Proceed: Verification Checklist
                </h3>
              </div>
              <p className="text-xs text-gray-500 mt-1">
                Mandatory protection actions students must verify prior to paying fees, replying, or downloading test code.
              </p>
            </div>
            
            <div className="text-right">
              <span className="text-xs font-bold font-mono text-gray-900 dark:text-white">
                {completed} / {total} Verified
              </span>
              <div className="w-28 h-2 bg-gray-100 dark:bg-gray-800 rounded-full mt-1.5 overflow-hidden">
                <div
                  className="h-full bg-emerald-500 rounded-full transition-all duration-300"
                  style={{ width: `${total ? (completed / total) * 100 : 0}%` }}
                ></div>
              </div>
            </div>
          </div>

          <div className="space-y-3">
            {checklist.map((step, idx) => {
              const isChecked = checkedMap[idx] || false;
              return (
                <div
                  key={idx}
                  onClick={() => toggleCheck(idx)}
                  className={`p-4 rounded-2xl border transition-all cursor-pointer select-none flex items-start gap-3.5 ${
                    isChecked
                      ? 'bg-emerald-50/70 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-800/40'
                      : 'bg-gray-50/60 dark:bg-tactile-darksurface/40 border-gray-200/80 dark:border-gray-800 hover:border-gray-400'
                  }`}
                >
                  <input
                    type="checkbox"
                    checked={isChecked}
                    onChange={() => {}}
                    className="mt-1 w-5 h-5 rounded-md text-emerald-600 focus:ring-0 cursor-pointer"
                  />
                  <div className="flex-1">
                    <div className="flex items-center gap-2">
                      <span className={`text-sm font-bold ${isChecked ? 'line-through text-gray-400' : 'text-gray-900 dark:text-white'}`}>
                        {step.step_title}
                      </span>
                      {step.is_mandatory && (
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 dark:bg-red-950 text-red-600 dark:text-red-400 font-mono">
                          MANDATORY
                        </span>
                      )}
                    </div>
                    <p className="text-xs text-gray-600 dark:text-gray-300 mt-1">
                      <strong className="text-gray-800 dark:text-gray-200">Why it matters:</strong> {step.why_it_matters}
                    </p>
                    <div className="mt-2.5 text-xs font-mono bg-white dark:bg-tactile-darkbg p-2.5 rounded-xl border border-gray-200 dark:border-gray-800 text-gray-800 dark:text-gray-200">
                      👉 {step.action_url_or_instruction}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {isAllDone && (
            <div className="mt-4 p-3.5 bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 rounded-2xl text-xs font-bold text-center border border-emerald-200">
              ✓ All pre-action verification checks completed. Safe to proceed according to guidance instructions!
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 4. Community Victim Network & External Go-To Portals Hub
    // =========================================================================
    function CommunityVictimAndExternalHub({ communityData, externalPortals }) {
      const [showModal, setShowModal] = useState(false);
      const [formData, setFormData] = useState({ org: '', amount: '', contact: '', desc: '' });
      const [statusMsg, setStatusMsg] = useState(null);

      const handleReportSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/community/report`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              incident_title: `Victim report: ${formData.org}`,

                  {threatRecord && (
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                      
                      {/* Left: Tactile Speedometer Gauge + PRIME Criteria Matrix */}
                      <div className="space-y-6">
                        <TactileGauge
                          score={threatRecord.fuzzy_risk_score}
                          tier={threatRecord.risk_tier}
                        />

                        {/* P.R.I.M.E. Criteria Bar Breakdown */}
                        <div className="bg-white dark:bg-tactile-darkcard rounded-3xl p-6 shadow-tactile border border-tactile-border dark:border-tactile-darkborder">
                          <h4 className="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-4">P.R.I.M.E. 6-Factor Assessment</h4>
                          <div className="space-y-3.5">
                            {[
                              { label: 'P: Proof & Domain Identity', val: threatRecord.prime_criteria_scores?.proof_domain_identity },
                              { label: 'R: Redirection & Obfuscation', val: threatRecord.prime_criteria_scores?.redirection_obfuscation },
                              { label: 'I: Incentive & Urgency', val: threatRecord.prime_criteria_scores?.incentive_urgency },
                              { label: 'M: Money & Transaction Ask', val: threatRecord.prime_criteria_scores?.money_transaction_ask },
                              { label: 'E: Execution & Code Safety', val: threatRecord.prime_criteria_scores?.execution_code_safety },
                              { label: 'S: Student Registry Check', val: threatRecord.prime_criteria_scores?.student_registry_check }
                            ].map((c, i) => (
                              <div key={i}>
                                <div className="flex justify-between text-xs font-semibold mb-1">
                                  <span className="text-gray-700 dark:text-gray-300">{c.label}</span>
                                  <span className="font-mono font-bold">{c.val || 0} / 10</span>
                                </div>
                                <div className="w-full h-2 bg-gray-100 dark:bg-gray-800 rounded-full overflow-hidden">
                                  <div
                                    className="h-full rounded-full transition-all duration-500"
                                    style={{
                                      width: `${(c.val || 0) * 10}%`,
                                      backgroundColor: (c.val || 0) > 7 ? '#EF4444' : ((c.val || 0) > 4 ? '#F59E0B' : '#10B981')
                                    }}
                                  ></div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Right: Evidence Red Flags + Interactive Verification Checklist */}
                      <div className="lg:col-span-2 space-y-6">
                        
                        {/* Evidence Findings Card */}
                        <div className="bg-white dark:bg-tactile-darkcard rounded-3xl p-6 shadow-tactile border border-tactile-border dark:border-tactile-darkborder">
                          <div className="flex items-center justify-between mb-3">
                            <h3 className="text-base font-bold text-gray-900 dark:text-white flex items-center gap-2">
                              <Icons.Alert />
                              Forensic Evidence & Fraud Indicators
                            </h3>
                            <span className="text-xs font-mono font-bold text-gray-400">
                              REF: {threatRecord.incident_id}
                            </span>
                          </div>
                          <div className="space-y-2">
                            {threatRecord.why_it_is_risky_summary?.map((evidence, idx) => (
                              <div key={idx} className="p-3 bg-red-50/70 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded-2xl text-xs text-red-900 dark:text-red-200 flex items-start gap-2.5">
                                <span className="text-red-500 font-bold">•</span>
                                <span className="leading-relaxed">{evidence}</span>
                              </div>
                            ))}
                          </div>

                          {/* Triggered Student Scam Flags */}
                          <div className="mt-4 pt-4 border-t border-gray-100 dark:border-gray-800 flex flex-wrap gap-2">
                            {threatRecord.extracted_indicators?.student_scam_flags && Object.entries(threatRecord.extracted_indicators.student_scam_flags).map(([k, v]) => (
                              v ? (
                                <span key={k} className="px-3 py-1 rounded-full text-[11px] font-bold bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 font-mono">
                                  🚩 {k.replace(/_/g, ' ').toUpperCase()}
                                </span>
                              ) : null
                            ))}
                          </div>
                        </div>

                        {/* Mandatory Interactive Verification Checklist */}
                        <VerificationChecklist
                          checklist={threatRecord.verify_before_proceeding_checklist || []}
                          incidentId={threatRecord.incident_id}
                        />

                      </div>

                    </div>
                  )}

                </div>
              )}

              {/* View 2: 3D Topographic Threat Network Canvas */}
              {currentView === 'network' && (
                <TopographicThreatGraph graphData={graphData} />
              )}

              {/* View 3: Community Victim Hub & External Go-To Portals */}
              {currentView === 'community' && (
                <CommunityVictimAndExternalHub
                  communityData={communityData}
                  externalPortals={externalPortals}
                />
              )}

              {/* View 4: Accessibility Bots & Extensions Hub (Member 2 Extension Support) */}
              {currentView === 'bots' && (
                <div className="bg-white dark:bg-tactile-darkcard rounded-3xl p-8 shadow-tactile-heavy border border-tactile-border dark:border-tactile-darkborder space-y-6">
                  <div className="flex items-center gap-3">
                    <span className="p-2.5 rounded-2xl bg-tactile-charcoal text-white dark:bg-white dark:text-black shadow-tactile-pill">
                      <Icons.Bot />
                    </span>
                    <div>
                      <h3 className="text-lg font-extrabold text-gray-900 dark:text-white">
                        Accessibility Extensions & Messaging Bots
                      </h3>
                      <p className="text-xs text-gray-500">
                        Connect Factora's AI analyzer directly into browser extensions, WhatsApp, and Telegram.
                      </p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                    <div className="p-5 bg-gray-50 dark:bg-tactile-darksurface rounded-2xl border border-gray-200 dark:border-gray-800">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-sm">Chrome Web Extension</span>
                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                      </div>
                      <p className="text-xs text-gray-500 mt-2">Auto-scans job posts on LinkedIn, Internshala, and Naukri.</p>
                      <button className="mt-4 px-3 py-1.5 rounded-full bg-tactile-charcoal text-white dark:bg-white dark:text-black text-xs font-bold shadow-tactile-pill">
                        Extension Active
                      </button>
                    </div>

                    <div className="p-5 bg-gray-50 dark:bg-tactile-darksurface rounded-2xl border border-gray-200 dark:border-gray-800">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-sm">WhatsApp Safety Bot</span>
                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                      </div>
                      <p className="text-xs text-gray-500 mt-2">Forward any suspicious WhatsApp offer to receive instant P.R.I.M.E. verdict.</p>
                      <button className="mt-4 px-3 py-1.5 rounded-full bg-tactile-charcoal text-white dark:bg-white dark:text-black text-xs font-bold shadow-tactile-pill">
                        Bot Connected
                      </button>
                    </div>

                    <div className="p-5 bg-gray-50 dark:bg-tactile-darksurface rounded-2xl border border-gray-200 dark:border-gray-800">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-sm">REST & Webhook API</span>
                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                      </div>
                      <p className="text-xs text-gray-500 mt-2">Direct JSON endpoint for campus placement portals & TPO ERPs.</p>
                      <code className="mt-3 block text-[11px] font-mono text-gray-600 dark:text-gray-300">
                        POST /api/analyzer/analyze
                      </code>
                    </div>
                  </div>
                </div>
              )}

            </main>

            {/* Footer */}
            <footer className="border-t border-tactile-border dark:border-tactile-darkborder py-6 mt-12 bg-white dark:bg-tactile-darkcard">
              <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between text-xs text-gray-400 gap-2">
                <span>Factora Autonomous Cyber Defense Platform • Problem 1: Safety Tech — FAKE OR REAL</span>
                <span>Trained on 32,500+ Real Benchmark Records • Calibrated ML & P.R.I.M.E. Engine</span>
              </div>
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
